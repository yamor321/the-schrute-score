# Kinds of development work visitors can pick on the dashboard ("Tasks ▾").
# Picking one or more swaps the general coding score in the cost-per-task
# formula for the average of their scores. Nothing picked = today's ranking.
#
# These are ACTIONS, not languages. Each type is scored by benchmarks BUILT
# for that kind of work (`sources`):
#   Artificial Analysis API (every run):
#     codingIndex    AA Coding Index — general coding
#     terminalBench  Terminal-Bench v2.1 — sysadmin, builds, environments in a real terminal
#     sciCode        SciCode — real scientific-computing problems
#   Public leaderboards (config/task-benchmarks.yaml, hand-kept snapshot):
#     sweAtlasQna    SWE-Atlas Codebase QnA (Scale) — deep codebase comprehension
#     itbench        ITBench-AA (Artificial Analysis × IBM) — Kubernetes incident root cause
#     deepswe        DeepSWE v1.1 (Datacurve/Mercor) — large novel changes in real repos
#   LMArena (fetched every run):
#     webdev         Code Arena WebDev — blind votes on building web apps
#
# A model that was measured on a source gets that measurement (put on the
# coding-score scale). One that wasn't is ESTIMATED from its general coding
# score, shrunk toward the average by how well the two agree across the
# models that have both. The dashboard marks every score as measured or
# estimated and shows each source's coverage and date.

types:
  - key: greenfield
    label: Build new features & services
    description: New API, service or module from a spec.
    sources: [codingIndex, deepswe]

  - key: legacy
    label: Change existing / legacy code
    description: Adapt, refactor or migrate a large existing codebase.
    sources: [deepswe]

  - key: explore
    label: Explore & explain a codebase
    description: Trace flows across files and repos, onboard, answer "how does this work", review.
    sources: [sweAtlasQna]

  - key: debug
    label: Debug, fix & test
    description: Reproduce, locate and fix bugs; write and repair tests.
    sources: [deepswe, terminalBench]

  - key: prod
    label: Production investigation
    description: Alerts, events and traces across services to find the root cause.
    sources: [itbench]

  - key: infra
    label: Infra, DevOps & scripting
    description: CI/CD, containers, shell, builds and environment setup.
    sources: [terminalBench]

  - key: algorithms
    label: Algorithms, data & scientific code
    description: Numerical code, data processing, algorithms.
    sources: [sciCode]

  - key: ui
    label: UI & web pages
    description: Front-end pages, components and web apps.
    sources: [webdev]
