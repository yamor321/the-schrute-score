# Scoring configuration for The Schrute Score.
# Edit this file to change which vendors are excluded and how models are
# ranked. No code changes needed — see README "Editing config/scoring.yaml".

# Vendors/creators to exclude entirely from the dashboard.
# Match is case-insensitive. Example: [deepseek, alibaba, google, zai]
excludeVendors: []

# Specific models to exclude, by name as shown on the dashboard. All of a
# model's effort levels go with it. Matching ignores case, word order and
# dashes. Example: ["Step 5 Preview", "Qwen3.8 Max"]
excludeModels:
  - Step 5 Preview   # StepFun preview release; removed by the owner

# Which benchmark fields (from the Artificial Analysis API) feed the
# composite "coding score," and how much each one counts.
# Default: the Artificial Analysis Coding Index alone. It is AA's current
# composite of coding evaluations (it already covers Terminal-Bench and
# others) and is what the frontier models are measured on. Mixing in
# LiveCodeBench let old models that only have that one test rank on a
# different, non-comparable basis.
# Weights don't need to sum to 1 — for any given model, they are
# renormalized over whichever of these fields that model actually has
# a value for (a model missing one benchmark isn't penalized as if it
# scored zero on it).
benchmarkWeights:
  codingIndex: 1

# Quality floor: a model must reach at least this fraction of the BEST
# model's coding score to be ranked at all. Stops cheap-but-weak models
# from winning just by being cheap. Relative, so it rises as models improve.
#   0.95 = only the very top tier     0.90 = near the top
#   0.85 = a bit wider                0    = no floor (pure score-per-dollar)
# 0.85 is set so that GPT-5.6 Luna (max, 71.4) and Cursor's Composer 2.5
# (estimated ~70.3) make the cut: with the best at 81.6 the bar is ~69.4.
qualityFloor: 0.85

# Brand-new models: Artificial Analysis often publishes a new model's
# Intelligence Index days before its Coding Index. Models released within
# this many days that have no Coding Index yet get a PROVISIONAL estimate
# (from models with a similar Intelligence Index), clearly marked on the
# dashboard and replaced automatically once the real score is out.
# Estimates never set the quality bar. 0 = off.
provisionalMaxAgeDays: 60

# Ranking metric: COST PER FINISHED TASK (lower = better). Fixed, one formula.
#   success chance p = coding score / 100
#   fix cost F = developerHourlyUsd × minutesPerFailedAttempt / 60      (= $26)
#   cost = (price per 1M tokens × tokensPerTaskMillions + F × (1 − p)) / p
# A smarter model fails less, so you re-prompt/fix less (F) and re-run less
# (tokens ÷ p). Each constant is research-based — sources in the README:
#   tokensPerTaskMillions 0.27: Artificial Analysis Coding Agent Index measured
#     $4.10/task for Opus 4.7 ($15 blended) and $4.82/task for GPT-5.5
#     ($17.50) → ~0.27M tokens per real agent task at list price.
#   developerHourlyUsd 78: senior developer in Israel, ~₪40K/month gross ×
#     1.30 employer cost ÷ 182 h ÷ ₪3.65/$.
#   minutesPerFailedAttempt 20: most failures are fixed by a correction
#     prompt (91.5% in a 20,574-session study), ~12 min to spot, re-prompt and
#     re-review; the rest need hands-on fixing (METR: 26–42 min per agent PR).
taskModel:
  tokensPerTaskMillions: 0.27
  developerHourlyUsd: 78
  minutesPerFailedAttempt: 20

# Which price figure (per 1M tokens) to use.
#   blended = (input price + output price) / 2
#   input   = input price per million tokens only
#   output  = output price per million tokens only
priceBasis: blended

# Minimum number of the benchmarkWeights fields above that must be
# present (non-null) for a model to be ranked at all. Prevents ranking
# a model off a single thin data point.
minBenchmarksRequired: 1
