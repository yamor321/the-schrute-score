# Task-specific benchmarks that are NOT in the Artificial Analysis API.
# A hand-kept snapshot of their public leaderboards, used to score the
# kinds of work in config/task-types.yaml. (LMArena WebDev is fetched
# automatically each run and doesn't live here.)
#
# Update by copying the current leaderboard into `scores`; set `asOf` to the
# leaderboard's own date and `checked` to today. The pipeline warns in the
# run log when a snapshot hasn't been checked for > 60 days.
# Model names are ours (as shown on the dashboard); matching ignores case,
# word order, dashes and effort levels. When a leaderboard lists a model
# several times (effort levels, agent harnesses), keep its best score.
#
# `vendorReported` lists entries that come from the model maker's own
# launch materials rather than an independent run; independent numbers are
# preferred whenever both exist.

benchmarks:
  sweAtlasQna:
    label: SWE-Atlas Codebase QnA
    publisher: Scale AI
    url: https://labs.scale.com/leaderboard/sweatlas-qna
    asOf: 2026-07-28      # leaderboard's own last update
    checked: 2026-09-26   # when this snapshot was last compared with it
    measures: 124 deep code-comprehension questions on 11 production repos (Go, Python, C, TypeScript) — tracing execution across files, explaining behaviour and design. Agents must run and explore the code.
    note: Scores include the agent harness used (Claude Code, Codex or Mini-SWE-Agent).
    scores:
