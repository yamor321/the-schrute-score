# Models you can pick in Cursor. Used to mark those models on the dashboard.
#
# Source: https://cursor.com/docs/models (checked on the date below).
# Cursor changes this list often. Update it by hand: add or remove a line,
# commit, and the site re-runs.
#
# Matching to Artificial Analysis names is automatic. Word order, dashes and
# anything in parentheses are ignored, so "Claude 4.5 Opus" matches AA's
# "Claude Opus 4.5 (Reasoning)", and all effort/reasoning variants of a model
# count as the same Cursor model. Add `aa:` only when AA uses a different
# name. `vendor` is only used for models AA has no data for (e.g. Composer).
#
# Cursor's "(Fast)", "fast mode", "1M" and "500k" entries are the same model
# with a different speed or context window, so each model is listed once.
# Image-only models (Gemini 3 Pro Image Preview) are left out.

source: https://cursor.com/docs/models
checked: 2026-09-25

